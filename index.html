    <script>
      (function() {
        try {
          var saved = localStorage.getItem('harish_atelier_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var focus = localStorage.getItem('harish_focus_mode');
          if (focus === 'true') {
            document.documentElement.setAttribute('data-focus-mode', 'true');
          }
        } catch (e) {}
      })();
    </script>
